<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝妈指数 · Mom Index</title>
<link rel="icon" href="data:,">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #0f172a;
  color: #e2e8f0;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  border-bottom: 1px solid #334155;
  padding: 20px 32px;
  text-align: center;
}
.header h1 {
  font-size: 28px;
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
}
.header .subtitle {
  color: #94a3b8;
  font-size: 14px;
}
.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

/* 指数卡片网格 */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 32px; }
.card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
}
.card.nasdaq::before   { background: linear-gradient(90deg, #3b82f6, #06b6d4); }
.card.gold::before     { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
.card.cpo::before      { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
.card.semiconductor::before { background: linear-gradient(90deg, #10b981, #34d399); }

.card .sector-name { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
.card .index-value { font-size: 48px; font-weight: 800; margin-bottom: 4px; }
.card .index-label { font-size: 14px; color: #64748b; margin-bottom: 12px; }
.card .signal { font-size: 13px; padding: 4px 10px; border-radius: 6px; display: inline-block; }
.card .signal.red    { background: rgba(239,68,68,0.15); color: #f87171; }
.card .signal.orange { background: rgba(251,146,60,0.15); color: #fb923c; }
.card .signal.yellow { background: rgba(250,204,21,0.15); color: #facc15; }
.card .signal.green  { background: rgba(34,197,94,0.15); color: #4ade80; }
.card .signal.blue   { background: rgba(59,130,246,0.15); color: #60a5fa; }

.card .detail-row {
  display: flex; justify-content: space-between;
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid #334155;
  font-size: 12px; color: #64748b;
}
.card .detail-row span { color: #cbd5e1; }

/* 图表区域 */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 24px; }
.chart-box {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 20px;
}
.chart-box h3 { font-size: 16px; margin-bottom: 16px; color: #e2e8f0; }

/* 公开样本文本示例 */
.top-posts {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 20px;
  margin-top: 24px;
}
.top-posts h3 { font-size: 16px; margin-bottom: 16px; }
.post-item {
  padding: 12px;
  border-bottom: 1px solid #334155;
  font-size: 13px;
}
.post-item:last-child { border-bottom: none; }
.post-item .post-title { color: #e2e8f0; margin-bottom: 4px; }
.post-item .post-meta { color: #64748b; font-size: 11px; }
.post-item .post-reason { color: #94a3b8; font-size: 12px; margin-top: 4px; font-style: italic; }
.post-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  margin-right: 8px;
}
.post-badge.pure   { background: rgba(239,68,68,0.2); color: #fca5a5; }
.post-badge.semi   { background: rgba(251,146,60,0.2); color: #fdba74; }

/* 图例 */
.legend { display: flex; gap: 16px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #94a3b8; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.legend-dot.nasdaq   { background: #06b6d4; }
.legend-dot.gold     { background: #fbbf24; }
.legend-dot.cpo      { background: #a78bfa; }
.legend-dot.semiconductor { background: #34d399; }

.footer { text-align: center; padding: 32px; color: #475569; font-size: 12px; }

/* 加载状态 */
.loading { text-align: center; padding: 60px; color: #64748b; }

@media (max-width: 600px) {
  .charts { grid-template-columns: 1fr; }
  .card .index-value { font-size: 36px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>👩‍👧 宝妈指数</h1>
  <div class="subtitle">东方财富四个 ETF 股吧 · 根据当日有更新的帖子标题试算</div>
  <div class="subtitle" id="update-time" style="margin-top:4px"></div>
</div>

<div class="container">
  <!-- 四个板块指数卡片 -->
  <div class="cards" id="cards"></div>

</div>

<div class="footer">
  热度满分 100。40–59 分为中等，60–74 分为较高，75 分起为很高。<br>
  买入和卖出显示的是规则识别出的帖子条数，仅反映本次样本中的文字表达。
</div>

<script>
const SECTOR_NAMES = {
  nasdaq: '纳斯达克',
  gold: '黄金', 
  cpo: 'CPO通信',
  semiconductor: '半导体'
};

function getSignalClass(idx) {
  if (idx >= 75) return 'red';
  if (idx >= 60) return 'orange';
  if (idx >= 40) return 'yellow';
  if (idx >= 20) return 'green';
  return 'blue';
}

function getEmoji(idx) {
  if (idx >= 75) return '🔴';
  if (idx >= 60) return '🟠';
  if (idx >= 40) return '🟡';
  if (idx >= 20) return '🟢';
  return '🔵';
}

function getHeatLabel(idx) {
  if (idx >= 75) return '样本讨论热度很高';
  if (idx >= 60) return '样本讨论热度较高';
  if (idx >= 40) return '样本讨论热度中等';
  if (idx >= 20) return '样本讨论热度偏低';
  return '样本讨论热度较低';
}

function renderCards(data) {
  const container = document.getElementById('cards');
  const latest = data.latest;
  if (!latest) {
    container.innerHTML = '<div class="loading">暂无样本</div>';
    return;
  }

  document.getElementById('update-time').textContent = 
    `样本更新至 ${(latest.sampled_at || latest.date).replace("T", " ").slice(0, 16)}（北京时间）`;

  container.innerHTML = Object.entries(latest.sectors).map(([key, sector]) => {
    const cls = getSignalClass(sector.index);
    const d = sector.details || {};
    return `
      <div class="card ${key}">
        <div class="sector-name">${getEmoji(sector.index)} ${SECTOR_NAMES[key]}</div>
        <div class="index-value">${sector.index}</div>
        <div class="index-label">公开样本讨论热度</div>
        <div class="signal ${cls}">${getHeatLabel(sector.index)}</div>
        <!-- 买入/卖出子指数 -->
        <div style="margin-top:14px; display:flex; gap:8px;">
          <div style="flex:1; background:rgba(34,197,94,0.08); border-radius:8px; padding:8px; text-align:center;">
            <div style="font-size:20px; font-weight:700; color:#4ade80;">${d.buy_count ?? 0} 条</div>
            <div style="font-size:10px; color:#64748b;">样本买入表达</div>
          </div>
          <div style="flex:1; background:rgba(239,68,68,0.08); border-radius:8px; padding:8px; text-align:center;">
            <div style="font-size:20px; font-weight:700; color:#f87171;">${d.sell_count ?? 0} 条</div>
            <div style="font-size:10px; color:#64748b;">样本卖出表达</div>
          </div>
        </div>
        <div class="detail-row">
          <span>有效标题</span><span>${d.valid_posts ?? 0} 条</span>
        </div>
      </div>
    `;
  }).join('');
}

fetch('dashboard_data.json', {cache: 'no-store'})
  .then(response => {
    if (!response.ok) throw new Error('样本暂时无法加载');
    return response.json();
  })
  .then(renderCards)
  .catch(() => {
    document.getElementById('cards').textContent = '样本暂时无法加载，请稍后刷新。';
  });
</script>
</body>
</html>
